<style>
:root{
  --bg:#F3EFE5;--side:#EAE4D6;--surface:#FFFFFF;--raised:#FAF7F0;--line:#E0D8C8;--line-strong:#CBBFA7;
  --text:#15322B;--muted:#56695F;--head:#F2ECDF;--zebra:#FBF8F2;--brass:#9C7430;--brass-strong:#7E5D22;--brass-soft:#F1E6CF;--on-brass:#FFFFFF;
  --danger:#B4432F;--danger-soft:#F8E4DE;--ok:#2F7A4F;--ok-soft:#E1F0E6;--warn:#8A6210;--warn-soft:#F6EACB;--track:#EFE9DC;
  --display:"Karantina","Secular One","Arial Narrow",Impact,sans-serif;
  --num:"Secular One","IBM Plex Sans Hebrew",Arial,sans-serif;
  --sans:"IBM Plex Sans Hebrew","Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --k1:#9C7430;--k2:#3F7D60;--k3:#B0522F;--k4:#3F63A6;--k5:#7650A6;--k6:#7E7028;--bad:#B4432F;--bad-soft:#F8E4DE;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;  --bg:#0D1714;--side:#09110E;--surface:#15221F;--raised:#1C2C28;--line:#2B3C37;--line-strong:#42574F;
  --text:#F3EFE5;--muted:#AEBBB5;--brass:#CFA75E;--brass-strong:#E2BE78;--brass-soft:#2E2C1E;--on-brass:#1A1508;--head:#1F302B;--zebra:#18261F;
  --danger:#E8907F;--danger-soft:#3A2420;--ok:#8CC7A1;--ok-soft:#1B3A2B;--warn:#E2B865;--warn-soft:#3A3120;--track:#243530;--k1:#C8A15A;--k2:#86BFA3;--k3:#E09A78;--k4:#93AEDD;--k5:#BFA2DE;--k6:#D9C98F;--bad:#E8907F;--bad-soft:#3A2420;
}}
:root[data-theme="dark"]{
  color-scheme:dark;  --bg:#0D1714;--side:#09110E;--surface:#15221F;--raised:#1C2C28;--line:#2B3C37;--line-strong:#42574F;
  --text:#F3EFE5;--muted:#AEBBB5;--brass:#CFA75E;--brass-strong:#E2BE78;--brass-soft:#2E2C1E;--on-brass:#1A1508;--head:#1F302B;--zebra:#18261F;
  --danger:#E8907F;--danger-soft:#3A2420;--ok:#8CC7A1;--ok-soft:#1B3A2B;--warn:#E2B865;--warn-soft:#3A3120;--track:#243530;--k1:#C8A15A;--k2:#86BFA3;--k3:#E09A78;--k4:#93AEDD;--k5:#BFA2DE;--k6:#D9C98F;--bad:#E8907F;--bad-soft:#3A2420;
}
:root[data-theme="graphite"]{
  color-scheme:dark;--bg:#111315;--side:#0C0E10;--surface:#1A1D20;--raised:#22262A;--line:#30353A;--line-strong:#474D53;
  --text:#F2F0EB;--muted:#A8AEB3;--brass:#D2AA60;--brass-strong:#E4C07B;--brass-soft:#2D281D;--on-brass:#1A1508;--head:#24282C;--zebra:#1D2023;
  --danger:#EF8E7D;--danger-soft:#3A2220;--ok:#86CFA0;--ok-soft:#1B2C22;--warn:#E6BD6C;--warn-soft:#342B1B;--track:#2A2F34;
  --k1:#D2AA60;--k2:#86C3A6;--k3:#E59C7B;--k4:#95B1E0;--k5:#C2A5E0;--k6:#DACB92;--bad:#EF8E7D;--bad-soft:#3A2220;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%}
.shell{height:100%;display:flex}
.side{width:264px;flex:none;background:var(--side);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--brass);color:var(--on-brass);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;padding-top:3px;line-height:1;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:.9;margin:0;white-space:nowrap;letter-spacing:.5px}
.brand .tag{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:10px;text-align:start;color:var(--muted);font-size:14.5px}
.nav:hover{background:var(--raised);color:var(--text)}
.nav.on{background:var(--brass-soft);color:var(--text);font-weight:500}
.nav.on svg{color:var(--brass)}
.nav .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.sidehead{font-size:12.5px;color:var(--muted);padding:18px 10px 6px;display:flex;align-items:center}
.sidesys .t{width:26px;height:26px;border-radius:7px;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.sidesys .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.sidefoot{margin-top:auto;padding-top:14px;display:flex;gap:8px;align-items:center}
.maincol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:16px 22px 12px;flex-wrap:wrap}
.bar .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bar h2{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:.3px}
.bar h2.sysh{font-size:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.mbrand{display:none}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none;text-decoration:none}
.ibtn:hover{color:var(--text);border-color:var(--line-strong)}
.ibtn.s{width:34px;height:34px}
.btn{color:var(--text);display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.primary:hover{background:var(--brass-strong)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 16px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--brass-soft);color:var(--text);font-weight:500}
.wstabs{display:none}
main{flex:1;min-height:0;display:flex}
#panel{flex:1;overflow:auto;padding:4px 22px 28px}
.work{flex:1;min-width:0;min-height:0;display:flex;gap:12px;padding:0 16px 16px}
.stagebox{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.stagebar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stagebar .lbl{font-size:13px;color:var(--muted);margin-inline-end:auto}
.stagebar .seg button{padding:4px 12px;font-size:13px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px;width:100%}
.stage{flex:1;min-height:0;position:relative;background:#fff}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.stage .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:var(--raised);font-size:14px}
.chat{width:400px;flex:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.draftbar{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--brass-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.draftbar .t{font-size:13px;flex:1 1 100%}
.msgs{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.bub.u{align-self:flex-start;background:var(--raised);border:1px solid var(--line)}
.bub.a{align-self:flex-end;border:1px solid var(--line);border-inline-end:3px solid var(--brass)}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:2px}
.bub .meta{display:block;margin-top:6px;font-size:12px;color:var(--brass)}
.bub .prog{display:block;font-size:12.5px;color:var(--muted)}
.chatin{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end}
.chatin textarea{flex:1;resize:none;min-height:42px;max-height:140px;border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:9px 11px;font-size:15px;line-height:1.4}
.chatempty{margin:auto 0;text-align:center;color:var(--muted);font-size:14px;padding:10px}
.chatempty .sugs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chatempty .sugs button{border:1px dashed var(--line-strong);background:transparent;border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--text)}
body:not(.view-sys) .work,body.mode-overview .work{display:none}
body.view-sys.mode-use #panel,body.view-sys.mode-work #panel,body.view-sys.mode-code #panel{display:none}
body.mode-use .chat{display:none}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.box h3{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.05;letter-spacing:.3px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.box h3 .aside{margin-inline-start:auto;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .l svg{color:var(--brass)}
.kpi .v{font-family:var(--num);font-weight:400;font-size:50px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--text);margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{border-color:var(--brass)}
.kpi.hl .v{color:var(--brass)}
.chart svg{display:block;width:100%;height:auto}
.hbar{display:flex;align-items:center;gap:10px;padding:6px 0}
.hbar .n{width:110px;flex:none;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.hbar .fl{height:100%;background:var(--brass);border-radius:5px}
.hbar .c{width:26px;text-align:end;font-size:13px;color:var(--muted)}
.att{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.att:first-of-type{border-top:0;padding-top:0}
.att .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.att .ico.w{background:var(--warn-soft);color:var(--warn)}
.att .ico.m{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.att .tx{flex:1;min-width:0;font-size:14px}
.att .tx small{display:block;color:var(--muted);font-size:12.5px}
.calm{display:flex;align-items:center;gap:10px;color:var(--ok);font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:400;color:var(--muted);font-size:12.5px;text-align:start;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--raised)}
.tbl .nm{display:flex;align-items:center;gap:10px;font-weight:500}
.tbl .num{font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.tile{width:46px;height:46px;flex:none;border-radius:12px;border:1.5px solid var(--c,var(--brass));color:var(--c,var(--brass));background:color-mix(in srgb,var(--c,var(--brass)) 14%,transparent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:32px;line-height:1;padding-top:3px}
.tile.xs{width:26px;height:26px;border-radius:7px;border-width:1px;font-size:19px;padding-top:2px}
.tile.sm{width:32px;height:32px;font-size:22px;border-radius:8px;border-width:1px;padding-top:2px}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-muted{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.feed{display:flex;flex-direction:column}
.fday{font-size:12.5px;color:var(--muted);padding:12px 0 4px}
.fitem{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.fitem .fi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);color:var(--brass);flex:none}
.fitem .ft{flex:1;min-width:0;font-size:14px}
.fitem .ft small{display:block;color:var(--muted);font-size:12.5px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .grow{flex:1;min-width:0}
.trow .sysn{font-size:12px;color:var(--muted)}
.cbx{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--on-brass)}
.cbx.on{background:var(--brass);border-color:var(--brass)}
.flag{border:0;background:transparent;color:var(--line-strong);padding:4px;border-radius:6px;display:grid;place-items:center}
.flag.on{color:var(--danger)}
.done{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-size:13.5px}
.chip.on{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .inp{flex:1 1 200px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.inp{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:0 11px;font-size:15px;width:100%}
select.inp{width:auto;min-width:130px}
textarea.inp{height:auto;min-height:120px;padding:9px 11px;resize:vertical}
.err{font-size:13px;color:var(--danger);min-height:1em}
.drop{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;cursor:pointer;color:var(--muted);font-size:14px}
.drop.has{border-style:solid;border-color:var(--brass);color:var(--text)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.step b{font-family:var(--num);font-size:38px;color:var(--brass);display:block;line-height:1}
.step h4{margin:8px 0 4px;font-size:15.5px;font-weight:500}
.step p{margin:0;color:var(--muted);font-size:13.5px}
.syscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.scard{display:flex;align-items:center;gap:12px;text-align:start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%}
.scard:hover{border-color:var(--line-strong)}
.scard .b{flex:1;min-width:0;display:flex;flex-direction:column}
.scard .nm{font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard small{color:var(--muted);font-size:12.5px}
.scard.add{border-style:dashed;justify-content:center;color:var(--muted);min-height:74px}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .grow{flex:1;min-width:0;font-size:14px}
.vrow small{display:block;color:var(--muted);font-size:12.5px}
.overlay{position:fixed;inset:0;background:rgba(6,18,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;border:1px solid var(--line)}
.sheet h3{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0 0 14px}
.sheet .acts{display:flex;gap:8px;margin-top:6px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px;padding-bottom:22px}}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.banner{margin:0 22px 10px;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.search{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:13.5px;width:100%;margin:0 0 6px}
.tabbar{display:none}
.cctop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}

mark{background:var(--brass);color:var(--on-brass);border-radius:3px;padding:0 1px}

/* ===== מתיחת פנים v14: כחול לילה וזהב / לבן נקי וכחול ===== */
:root{color-scheme:light;--bg:#F5F7FA;--side:#FFFFFF;--surface:#FFFFFF;--raised:#F8FAFC;--line:#E4E8EE;--line-strong:#D3D9E2;--text:#0F1B2D;--muted:#55657A;--head:#F1F4F8;--zebra:#FAFBFD;--brass:#2563EB;--brass-strong:#1D4ED8;--brass-soft:#E8F0FE;--on-brass:#FFFFFF;--danger:#C2410C;--danger-soft:#FDEEE6;--ok:#15803D;--ok-soft:#E7F6EE;--warn:#B45309;--warn-soft:#FEF3E2;--track:#E9EDF2;--k1:#2563EB;--k2:#15803D;--k3:#C2410C;--k4:#0E7490;--k5:#7C3AED;--k6:#A16207;--bad:#C2410C;--bad-soft:#FDEEE6;--info:#0E7490;--info-soft:#E3F3F7;--faint:#8794A6;--hover:#F1F4F8;--shadow:0 1px 2px rgba(15,27,45,.06)}
:root[data-theme="light"]{color-scheme:light;--bg:#F5F7FA;--side:#FFFFFF;--surface:#FFFFFF;--raised:#F8FAFC;--line:#E4E8EE;--line-strong:#D3D9E2;--text:#0F1B2D;--muted:#55657A;--head:#F1F4F8;--zebra:#FAFBFD;--brass:#2563EB;--brass-strong:#1D4ED8;--brass-soft:#E8F0FE;--on-brass:#FFFFFF;--danger:#C2410C;--danger-soft:#FDEEE6;--ok:#15803D;--ok-soft:#E7F6EE;--warn:#B45309;--warn-soft:#FEF3E2;--track:#E9EDF2;--k1:#2563EB;--k2:#15803D;--k3:#C2410C;--k4:#0E7490;--k5:#7C3AED;--k6:#A16207;--bad:#C2410C;--bad-soft:#FDEEE6;--info:#0E7490;--info-soft:#E3F3F7;--faint:#8794A6;--hover:#F1F4F8;--shadow:0 1px 2px rgba(15,27,45,.06)}
:root[data-theme="dark"],:root[data-theme="graphite"]{color-scheme:dark;--bg:#0D1524;--side:#0A101C;--surface:#131D31;--raised:#18243C;--line:#22304A;--line-strong:#2F3F5E;--text:#ECEFF5;--muted:#93A0B8;--head:#18243C;--zebra:#152037;--brass:#D4A94F;--brass-strong:#E6C277;--brass-soft:rgba(212,169,79,.13);--on-brass:#1A1405;--danger:#F08A7A;--danger-soft:rgba(240,138,122,.13);--ok:#6FCF9B;--ok-soft:rgba(111,207,155,.13);--warn:#E9B95E;--warn-soft:rgba(233,185,94,.13);--track:#22304A;--k1:#D4A94F;--k2:#6FCF9B;--k3:#E9A07E;--k4:#8DB4F0;--k5:#C9A0F0;--k6:#7FD3D9;--bad:#F08A7A;--bad-soft:rgba(240,138,122,.13);--info:#8DB4F0;--info-soft:rgba(141,180,240,.13);--faint:#69768F;--hover:#1D2A45;--shadow:0 1px 0 rgba(255,255,255,.03) inset}
/* בסיס */
.side{width:248px;padding:14px 10px;gap:2px}
.brand{padding:4px 6px 14px}.mark{width:34px;height:34px;border-radius:10px;font-size:27px}.brand h1{font-size:30px}.brand .tag{display:none}
.nav{height:36px;padding:0 10px;border-radius:9px;gap:11px;font-size:14.5px}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--brass-soft);color:var(--text)}
.nav .cnt{min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px;background:var(--raised);font-size:11.5px}
.sidehead{font-size:11.5px;color:var(--faint);padding:14px 10px 4px;letter-spacing:.3px}
.cmdk{height:36px;border-radius:10px}
.btn{height:36px;border-radius:9px;padding:0 14px;border-color:var(--line-strong)}
.btn:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 11px;border-radius:8px}
.ibtn{width:36px;height:36px;border-radius:9px}
.seg{background:var(--raised);border-radius:10px}
.seg button{border-radius:7px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.chip{height:32px;border-radius:9px;color:var(--muted);background:none}
.chip:hover{color:var(--text);border-color:var(--line-strong)}
.chip.on{border-color:color-mix(in srgb,var(--brass) 50%,transparent);color:var(--text);background:var(--brass-soft);font-weight:500}
.ccseg button{border-radius:9px}
.ccseg button.on{border-color:color-mix(in srgb,var(--brass) 50%,transparent);color:var(--text)}
.inp{border-radius:9px;border-color:var(--line-strong);background:var(--surface)}
.inp:focus{outline:0;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
select.inp{background-color:var(--surface)}
.badge{border-radius:20px;padding:2px 9px;font-size:12px;font-weight:500}
.b-muted{border:0}
/* כרטיסים */
.box,.kpi,.scard2,.step,.tcard2,.scard,.bcol{border-radius:12px}
.box,.kpi,.scard2,.step,.sec{box-shadow:var(--shadow)}
.box{padding:16px 18px}
.box>h3:first-child{font-family:var(--sans);font-weight:600;font-size:15.5px;letter-spacing:0;line-height:1.3;margin:-16px -18px 14px;padding:13px 18px;border-bottom:1px solid var(--line);min-height:50px}
.box h3{font-family:var(--sans);font-weight:600;font-size:15.5px;letter-spacing:0;line-height:1.3}
.box h3 svg{color:var(--muted)}

  open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('mikhlol',3);r.onupgradeneeded=()=>{const d=r.result;['systems','files','chats','thumbs','handles','templates'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{try{this.db.close()}catch(e){}staleTab()};res(this.db)};r.onerror=()=>rej(r.error);r.onblocked=()=>{try{blockedGate()}catch(e){}}})},
  req(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return rej(new Error('closed'));let t;try{t=this.db.transaction(store,mode)}catch(e){return rej(e)}const q=fn(t.objectStore(store));let out;if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  rget(st,k){return this.req(st,'readonly',o=>o.get(k))},rput(st,k,v){return this.req(st,'readwrite',o=>o.put(v,k))},
  del(st,k){return this.req(st,'readwrite',o=>o.delete(k))},rall(st){return this.req(st,'readonly',o=>o.getAll())},
  keys(st){return this.req(st,'readonly',o=>o.getAllKeys())},clear(st){return this.req(st,'readwrite',o=>o.clear())}
};

function dayBuckets(evs,days){
  const today=new Date();today.setHours(0,0,0,0);const start=today.getTime()-(days-1)*DAY;
  const b=Array.from({length:days},(_,i)=>({t:start+i*DAY,n:0}));
  for(const e of evs){if(e.at>=start){const i=Math.floor((e.at-start)/DAY);if(b[i])b[i].n++}}
  return b;
}
function barChart(b,label){
  const W=640,H=170,pad=24,gap=6,max=Math.max(1,...b.map(x=>x.n));
  const bw=(W-gap*(b.length-1))/b.length;
  const bars=b.map((x,i)=>{const h=x.n?Math.max(6,(H-pad-18)*x.n/max):3;const xx=W-(i+1)*bw-i*gap;const y=H-pad-h;const d=new Date(x.t);
    const lab=(i%2===(b.length-1)%2)?`<text x="${xx+bw/2}" y="${H-6}" text-anchor="middle" style="fill:var(--muted);font-size:12px;font-family:var(--sans)">${d.getDate()}/${d.getMonth()+1}</text>`:'';
    const val=x.n?`<text x="${xx+bw/2}" y="${y-5}" text-anchor="middle" style="fill:var(--text);font-size:12px;font-family:var(--sans)">${x.n}</text>`:'';
    return `<g><title>${d.toLocaleDateString('he-IL')}: ${x.n} ${label}</title><rect x="${xx}" y="${y}" width="${bw}" height="${h}" rx="4" style="fill:${!x.n?'var(--track)':i===b.length-1?'var(--brass)':'color-mix(in srgb,var(--info) 55%,var(--raised))'}"/>${val}${lab}</g>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} לפי יום">${bars}</svg></div>`;
}

function sig(s){const d=S.drafts[s.id];const c=ensureChat(s.id);return [s.assetId,s.draftAssetId,d?d.rev+':'+d.stack.length+':'+d.changes:'',c.length,S.busy,!!AI.key(),S.ready,S.pick[s.id]?S.pick[s.id].label:''].join('|')}

async function ensureDraft(s){
  if(S.drafts[s.id])return S.drafts[s.id];
  let text,changes=0,requests=[];
  if(s.draftAssetId){text=await getFile(s.draftAssetId);changes=(s.draftMeta&&s.draftMeta.changes)||0;requests=(s.draftMeta&&s.draftMeta.requests)||[]}
  else text=await getFile(s.assetId);
  return S.drafts[s.id]={text,rev:1,stack:[],changes,requests,persisted:!!s.draftAssetId};
}
async function persistDraft(s){
  const d=S.drafts[s.id];if(!d)return;
  const old=s.draftAssetId;
  const id=await putFile(d.text);
  const cur=S.systems.find(x=>x.id===s.id)||s;
  const ns=JSON.parse(JSON.stringify(cur));ns.id=s.id;
  ns.draftAssetId=id;ns.draftMeta={changes:d.changes,requests:d.requests.slice(-12),at:Date.now()};
  d.persisted=true;
  await saveSys(ns);
  if(old&&old!==id)dropAsset(old,ns);
}

const RULES=(s,d,small)=>`You are the maintenance engineer inside "מכלול", Ilan's personal command center for the web systems he built himself. You are working on the system "${s.name}": a single-file HTML app (${d.text.split('\n').length} lines, ${kb(bytes(d.text))}). The app is Hebrew and right-to-left.
${small?'The complete current file is included at the end of this message.':'The file is too large to include, so use the tools: get_outline for a map of the file, search to locate code, read_lines to read exact code.'}
To change code, call replace_text. Its "find" must be copied exactly from the file (without the line-number prefix that read_lines adds) and must appear exactly once; add surrounding lines to make it unique.
Rules:
- Make the smallest correct change and keep the existing style, structure, and Hebrew RTL behaviour. Never rewrite the whole file; several small replace_text calls are fine.
- If the request is a question, answer it without editing.
- If the request is unclear, ask one short question instead of editing.
- If an edit fails, read the exact lines again and retry with corrected text.
- After you finish editing, call check_preview once. If it reports new errors caused by your change, fix them and check again (at most two fix rounds). Mention the result in one short clause.
- You can see the page: call view_preview to get a real screenshot of the draft (390 = phone, 820 = tablet, 1280 = desktop). Use it after changes to layout, styling or content placement, and check the phone width when mobile matters. If the user attached screenshots, look at them carefully first.
- If the message includes a selected element, that is what the user means by "this" or "here".
- Your final message is in Hebrew, 1 to 4 short sentences: what you changed and where, or the answer. No code blocks unless asked.${small?'\n\n=== FILE START ===\n'+d.text+'\n=== FILE END ===':''}`;

function makeTools(d,m,i,edits){
  const lines=()=>d.text.split('\n');
  const prog=t=>{m.prog=t;updateBubble(i,m)};
  return [
    {name:'get_outline',description:'Returns a map of the file: line numbers of functions, sections, element ids and major comments. Use first on large files.',
     execute(){prog('ממפה את הקובץ…');const L=lines();const out=[];const re=/(function\s+[\w$]+|(const|let|var)\s+[\w$]+\s*=\s*(async\s*)?(\(|function)|<section|<(div|main|nav|header|aside)[^>]*\sid=|class\s+[A-Z]\w*|\/\/\s*[=#-]{3,}|<!--|window\.[\w$]+\s*=|<script|<style)/;for(let n=0;n<L.length&&out.length<220;n++){if(re.test(L[n]))out.push((n+1)+'| '+L[n].trim().slice(0,110))}return out.join('\n')||'No markers found; use search.'}},
    {name:'search',description:'Case-insensitive text search in the file. Returns up to 30 matching lines as "line| text". Use short distinctive terms.',
     inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
     execute(inp){const q=String(inp.query||'').toLowerCase();if(!q)throw new Error('empty query');prog('מחפש: '+String(inp.query).slice(0,40));const L=lines();const out=[];for(let n=0;n<L.length&&out.length<30;n++){if(L[n].toLowerCase().includes(q))out.push((n+1)+'| '+L[n].trim().slice(0,200))}return out.length?out.join('\n'):'No matches.'}},
    {name:'read_lines',description:'Returns lines start..end (1-based, inclusive, at most 300 lines) as "line| text".',
     inputSchema:{type:'object',properties:{start:{type:'integer'},end:{type:'integer'}},required:['start','end']},
     execute(inp){const L=lines();let a=Math.max(1,parseInt(inp.start)||1);let b=Math.min(L.length,parseInt(inp.end)||a+80,a+299);prog(`קורא שורות ${a} עד ${b}`);let out='',n=a;for(;n<=b;n++){const ln=n+'| '+L[n-1]+'\n';if(out.length+ln.length>26000)break;out+=ln}return out+(n<=b?'[truncated at line '+(n-1)+']':'')}},
    {name:'replace_text',description:'Replaces one exact, unique occurrence of "find" with "replace" in the draft. Returns the line number on success; throws if "find" is missing or appears more than once.',
     inputSchema:{type:'object',properties:{find:{type:'string'},replace:{type:'string'}},required:['find','replace']},
     execute(inp){const f=String(inp.find||'');const r=String(inp.replace==null?'':inp.replace);if(!f)throw new Error('find is empty');const c=d.text.split(f).length-1;if(c===0)throw new Error('find text not found. Read the exact lines again and copy them without line numbers.');if(c>1)throw new Error('find text appears '+c+' times. Include more surrounding lines so it is unique.');prog('עורך את הקוד…');const idx=d.text.indexOf(f);d.stack.push(d.text);if(d.stack.length>15)d.stack.shift();d.text=d.text.slice(0,idx)+r+d.text.slice(idx+f.length);d.rev++;d.changes++;edits.n++;return 'ok, edited near line '+(d.text.slice(0,idx).split('\n').length)}}
  ];
}
function sampleMsg(e){const c=e&&e.code;return c==='cancelled'?'נעצר.':c==='no_key'?'כדי לעבוד עם Claude צריך להגדיר מפתח API במסך ההגדרות.':c==='auth'?'מפתח ה-API לא תקין. בדוק אותו במסך ההגדרות.':c==='forbidden'?'למפתח הזה אין הרשאה. בדוק אותו בקונסולה של Anthropic.':c==='bad_model'?'המודל שנבחר לא זמין למפתח הזה. בחר מודל אחר בהגדרות.':c==='rate_limited'?'יותר מדי בקשות כרגע. נסה שוב בעוד דקה.':c==='overloaded'?'השרתים של Claude עמוסים כרגע. נסה שוב בעוד רגע.':c==='prompt_too_large'?'הבקשה ארוכה מדי. נסה לבקש שינוי קטן יותר.':c==='invalid_json'?'התשובה לא הגיעה בפורמט הנכון. נסה שוב.':c==='network'?'אין חיבור לאינטרנט, או שהבקשה נחסמה.':'משהו השתבש בחיבור ל-Claude. נסה שוב.'}

async function send(text){
  const s=sel();if(!s||S.busy||!s.assetId)return;
  let msg=(text||($('#chatText')&&$('#chatText').value)||'').trim();if(!msg&&(S.imgs[s.id]||[]).length)msg='תסתכל על התמונה המצורפת ותגיד מה צריך לתקן.';if(!msg)return;
  if(!S.sample){toast('העבודה עם Claude לא זמינה בתצוגה הזו.');return}
  let d;try{d=await ensureDraft(s)}catch(e){toast('לא הצלחתי לטעון את הקובץ.');return}
  const chat=ensureChat(s.id);
  const history=chat.filter(m=>m.role!=='sys'&&m.text&&!m.pending).slice(-8).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text.slice(0,800)}));
  const pk=S.pick[s.id];delete S.pick[s.id];const imgs=(S.imgs[s.id]||[]).slice();delete S.imgs[s.id];
  const full=pk?msg+`\n\n[The user selected this element in the live preview]\nCSS path: ${pk.selector}\nTag: ${pk.tag}${pk.id?'\nid: '+pk.id:''}${pk.cls?'\nclass: '+pk.cls:''}${pk.text?'\nVisible text: '+pk.text:''}\nouterHTML at runtime (it may differ from the source if JavaScript generated it):\n${pk.html}\nFind this element in the source with search (by id, class or its text) before editing.`:msg;
  chat.push({role:'user',text:msg,pick:pk?pk.label:null,thumbs:imgs.map(x=>x.thumb)});const m={role:'assistant',text:'',pending:true,prog:'Claude חושב…'};chat.push(m);const i=chat.length-1;
  S.busy=true;S.ctl=new AbortController();if($('#chatText'))$('#chatText').value='';renderChat();
  const edits={n:0};
  const small=bytes(d.text)<30000;
  const input=[{role:'user',content:RULES(s,d,small)},...history,{role:'user',content:imgs.length?[...imgs.map(im=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:im.data}})),{type:'text',text:(imgs.length===1?'[The user attached a screenshot.]\n':'[The user attached '+imgs.length+' screenshots.]\n')+full}]:full}];
  const onText=({text})=>{m.text=text;m.prog='';updateBubble(i,m)};
  try{
    if(S.toolsOK){
      const tools=makeTools(d,m,i,edits);tools.push(checkTool(s,d,m,t=>{m.prog=t;updateBubble(i,m)}));tools.push(viewTool(s,d,m,t=>{m.prog=t;updateBubble(i,m)}));
      const r=await S.sample(input,{tools,signal:S.ctl.signal,onText});
      m.text=r.text.trim();if(r.truncated)m.text+='\n(התשובה נקטעה)';
    }else if(small){
      const res=await S.sample.json([...input.slice(0,-1),{role:'user',content:msg+'\n\nReply with only JSON: {"summary":"Hebrew, 1-4 sentences","edits":[{"find":"exact unique text from the file","replace":"new text"}]}. Use an empty edits array for questions.'}],{signal:S.ctl.signal,cache:false});
      const fails=[];
      for(const e of (res&&Array.isArray(res.edits)?res.edits:[])){const f=String(e.find||'');const c=f?d.text.split(f).length-1:0;if(c!==1){fails.push(f.slice(0,40));continue}const idx=d.text.indexOf(f);d.stack.push(d.text);if(d.stack.length>15)d.stack.shift();d.text=d.text.slice(0,idx)+String(e.replace||'')+d.text.slice(idx+f.length);d.rev++;d.changes++;edits.n++}

/* health check */
function readTools(d,prog){
  const lines=()=>d.text.split('\n');
  return [
    {name:'get_outline',description:'Returns a map of the file: line numbers of functions, sections, element ids and major comments.',
     execute(){prog('ממפה את הקובץ…');const L=lines();const out=[];const re=/(function\s+[\w$]+|(const|let|var)\s+[\w$]+\s*=\s*(async\s*)?(\(|function)|<section|<(div|main|nav|header|aside)[^>]*\sid=|class\s+[A-Z]\w*|\/\/\s*[=#-]{3,}|<!--|window\.[\w$]+\s*=|<script|<style)/;for(let n=0;n<L.length&&out.length<220;n++){if(re.test(L[n]))out.push((n+1)+'| '+L[n].trim().slice(0,110))}return out.join('\n')||'No markers found; use search.'}},
    {name:'search',description:'Case-insensitive text search. Returns up to 30 matching lines as "line| text".',
     inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
     execute(inp){const q=String(inp.query||'').toLowerCase();if(!q)throw new Error('empty query');prog('מחפש: '+String(inp.query).slice(0,40));const L=lines();const out=[];for(let n=0;n<L.length&&out.length<30;n++){if(L[n].toLowerCase().includes(q))out.push((n+1)+'| '+L[n].trim().slice(0,200))}return out.length?out.join('\n'):'No matches.'}},
    {name:'read_lines',description:'Returns lines start..end (1-based, inclusive, at most 300 lines) as "line| text".',
     inputSchema:{type:'object',properties:{start:{type:'integer'},end:{type:'integer'}},required:['start','end']},
     execute(inp){const L=lines();let a=Math.max(1,parseInt(inp.start)||1);let b=Math.min(L.length,parseInt(inp.end)||a+80,a+299);prog(`קורא שורות ${a} עד ${b}`);let out='',n=a;for(;n<=b;n++){const ln=n+'| '+L[n-1]+'\n';if(out.length+ln.length>26000)break;out+=ln}return out+(n<=b?'[truncated at line '+(n-1)+']':'')}}
  ];
}

function mergeTurns(input){
  const arr=typeof input==='string'?[{role:'user',content:input}]:input;const out=[];

/* diff */
function lineDiff(A,B){
  let p=0;while(p<A.length&&p<B.length&&A[p]===B[p])p++;
  let sA=A.length,sB=B.length;while(sA>p&&sB>p&&A[sA-1]===B[sB-1]){sA--;sB--}
  const a=A.slice(p,sA),b=B.slice(p,sB),n=a.length,m=b.length;let mid=[];
  if((n+1)*(m+1)<=3000000){
    const W=m+1,dp=new Uint32Array((n+1)*W);
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
    let i=0,j=0;
    while(i<n&&j<m){if(a[i]===b[j]){mid.push({t:' ',l:a[i],na:p+i+1,nb:p+j+1});i++;j++}else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){mid.push({t:'-',l:a[i],na:p+i+1});i++}else{mid.push({t:'+',l:b[j],nb:p+j+1});j++}}
    while(i<n){mid.push({t:'-',l:a[i],na:p+i+1});i++}while(j<m){mid.push({t:'+',l:b[j],nb:p+j+1});j++}
  }else mid=a.map((l,k)=>({t:'-',l,na:p+k+1})).concat(b.map((l,k)=>({t:'+',l,nb:p+k+1})));
  const ops=[];for(let k=0;k<p;k++)ops.push({t:' ',l:A[k],na:k+1,nb:k+1});
  for(const o of mid)ops.push(o);
  for(let k=0;k<A.length-sA;k++)ops.push({t:' ',l:A[sA+k],na:sA+k+1,nb:sB+k+1});
  return ops;
}
function diffView(A,B){
  const ops=lineDiff(String(A).split('\n'),String(B).split('\n'));
  const ch=[];ops.forEach((o,k)=>{if(o.t!==' ')ch.push(k)});
  if(!ch.length)return '<p class="empty">אין הבדלים בין שתי הגרסאות.</p>';
  const keep=new Uint8Array(ops.length);for(const k of ch)for(let x=Math.max(0,k-3);x<=Math.min(ops.length-1,k+3);x++)keep[x]=1;
  let h='',shown=0,gap=0,cut=false;
  for(let k=0;k<ops.length;k++){
    if(!keep[k]){gap++;continue}
    if(gap){h+=`<div class="dl gap">⋯ ${nfmt(gap)} שורות ללא שינוי</div>`;gap=0}
    if(shown++>800){cut=true;break}
    const o=ops[k];h+=`<div class="dl ${o.t==='+'?'add':o.t==='-'?'del':''}"><span class="ln">${o.t==='+'?'':o.na}</span><span class="ln">${o.t==='-'?'':o.nb}</span><span class="sg">${o.t===' '?'':o.t==='-'?'−':'+'}</span><code>${esc(o.l)}</code></div>`;
  }
  if(cut)h+='<div class="dl gap">ההשוואה ארוכה מדי, מוצגות 800 השורות הראשונות</div>';else if(gap)h+=`<div class="dl gap">⋯ ${nfmt(gap)} שורות ללא שינוי</div>`;
  const add=ops.filter(o=>o.t==='+').length,del=ops.filter(o=>o.t==='-').length;
  return `<p class="diff" style="margin:0 0 10px"><span class="a">+${nfmt(add)}</span> <span class="r">−${nfmt(del)}</span> שורות</p><div class="dview" dir="ltr">${h}</div>`;
}

function httpCode(status,m){return status===401?'auth':status===403?'forbidden':status===429?'rate_limited':(status===529||status===503)?'overloaded':status===404?'bad_model':(status===400&&/too long|too many tokens|context/i.test(m||''))?'prompt_too_large':'api'}
function addUsage(i,o,cr){const u=usage();u.in+=i||0;u.out+=o||0;u.cache=(u.cache||0)+(cr||0);u.calls++;ls.set('mk-usage',JSON.stringify(u))}
async function streamClaude(messages,{maxTokens=16000,onDelta,signal}={}){
  const k=AI.key();if(!k)throw{code:'no_key'};
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI.model(),max_tokens:maxTokens,stream:true,messages})})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'network'}}
  if(!r.ok){let j=null;try{j=await r.json()}catch(e){}const m=(j&&j.error&&j.error.message)||'';throw{code:httpCode(r.status,m),detail:m}}
  const rd=r.body.getReader();const dec=new TextDecoder();let buf='',text='',stop='',uin=0,uout=0;
  try{for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let idx;
    while((idx=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,idx);buf=buf.slice(idx+2);const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;let ev;try{ev=JSON.parse(line.slice(5).trim())}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;if(onDelta)onDelta(text)}
      else if(ev.type==='message_start'&&ev.message&&ev.message.usage)uin=ev.message.usage.input_tokens||0;
      else if(ev.type==='message_delta'){if(ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;if(ev.usage&&ev.usage.output_tokens)uout=ev.usage.output_tokens}
      else if(ev.type==='error')throw{code:ev.error&&ev.error.type==='overloaded_error'?'overloaded':'api',detail:ev.error&&ev.error.message}}}}
  catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw e}
  addUsage(uin,uout);return{text,stop};
}

/* ===== v5: encryption + login, disk-linked files, auto backup, thumbnails, streaming + caching ===== */
const ENC=new Set(['systems','files','chats','thumbs','templates']);
const CRYPTO={dek:null,raw:null};const ITER=310000;
function b64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function ub64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKEK(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrapDEK(raw,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const kek=await deriveKEK(pw,salt,ITER);const w=await crypto.subtle.encrypt({name:'AES-GCM',iv},kek,raw);return{salt:b64(salt),iv:b64(iv),wrapped:b64(w),iter:ITER}}
async function unwrapDEK(a,pw){const kek=await deriveKEK(pw,ub64(a.salt),a.iter||ITER);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(a.iv)},kek,ub64(a.wrapped)))}
const importDEK=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function encWith(key,str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(str));return{iv,ct}}
async function decWith(key,iv,ct){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct))}
async function encV(v){const r=await encWith(CRYPTO.dek,JSON.stringify(v));return{__enc:1,iv:r.iv,ct:r.ct}}
async function decV(r){if(!r||!r.__enc)return r;if(!CRYPTO.dek)throw new Error('locked');return JSON.parse(await decWith(CRYPTO.dek,r.iv,r.ct))}
async function encSmall(str){const r=await encWith(CRYPTO.dek,str);return JSON.stringify({iv:b64(r.iv),ct:b64(r.ct)})}
async function decSmall(j){const o=JSON.parse(j);return decWith(CRYPTO.dek,ub64(o.iv),ub64(o.ct))}
IDB.get=async function(st,k){const v=await this.rget(st,k);return ENC.has(st)?decV(v):v};
IDB.put=async function(st,k,v){return this.rput(st,k,ENC.has(st)&&CRYPTO.dek?await encV(v):v)};
IDB.all=async function(st){const L=await this.rall(st);return ENC.has(st)?Promise.all((L||[]).map(decV)):L};
function getAuth(){try{return JSON.parse(ls.get('mk-auth')||'null')}catch(e){return null}}
async function setApiKey(k){S.apiKey=k||'';if(!k){ls.set('mk-key-enc','');ls.set('mk-key','');return}if(CRYPTO.dek){ls.set('mk-key-enc',await encSmall(k));ls.set('mk-key','')}else ls.set('mk-key',k)}
async function migrateEncrypt(){if(S.mem||!CRYPTO.dek)return;for(const st of ENC){let ks=[];try{ks=await IDB.keys(st)}catch(e){continue}for(const k of ks){const v=await IDB.rget(st,k);if(v!=null&&!v.__enc)await IDB.rput(st,k,await encV(v))}}}

async function checkDisk(s,interactive){
  if(!s||!s.link)return;const h=await getHandle('sys:'+s.id);if(!h){S.disk[s.id]={perm:'missing'};if(!sel()||S.mode==='overview')renderPanel();return}

/* backups: encrypted, manual + automatic to a folder */
async function backupPayload(){
  const files={};for(const s of S.systems)for(const id of sysFileIds(s)){try{files[id]=await getFile(id)}catch(e){}}
  const chats={};if(!S.mem)for(const s of S.systems){try{const c=await IDB.get('chats',s.id);if(c)chats[s.id]=c}catch(e){}}
  for(const t of S.templates){try{files[t.assetId]=await getFile(t.assetId)}catch(e){}}
  return{systems:S.systems,files,chats,templates:S.templates};
}
async function backupString(){
  const data=await backupPayload();const at=new Date().toISOString();
  if(!CRYPTO.dek)return JSON.stringify(Object.assign({app:'mikhlol',version:2,enc:false,exportedAt:at},data));
  const r=await encWith(CRYPTO.dek,JSON.stringify(data));const a=getAuth();
  return JSON.stringify({app:'mikhlol',version:2,enc:true,exportedAt:at,count:S.systems.length,auth:{salt:a.salt,iv:a.iv,wrapped:a.wrapped,iter:a.iter},iv:b64(r.iv),ct:b64(r.ct)});
}
async function backup(){try{const str=await backupString();await S.downloads.save({filename:'mikhlol-backup-'+new Date().toISOString().slice(0,10)+'.json',data:str,mimeType:'application/json'});ls.set('mk-bk-manual',String(Date.now()));toast('הגיבוי המוצפן ירד למחשב');renderBanner()}catch(e){toast('הגיבוי לא הצליח.')}}
function askPassword(title,body){return new Promise(res=>{$('#layer').innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pt"><h3 id="pt">${esc(title)}</h3><p class="empty" style="margin:-6px 0 12px">${esc(body)}</p><div class="field"><label for="apw">סיסמה</label><input class="inp" id="apw" type="password" autocomplete="current-password"></div><div class="acts"><button class="btn primary" id="apOk">המשך</button><button class="btn" id="apNo">ביטול</button></div></div></div>`;const done=v=>{$('#layer').innerHTML='';res(v)};$('#apOk').onclick=()=>done($('#apw').value);$('#apNo').onclick=()=>done(null);$('#apw').onkeydown=e=>{if(e.key==='Enter')done($('#apw').value)};$('#apw').focus()})}
async function importBackup(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast('הקובץ הזה לא נראה כמו גיבוי של מכלול.');return}
  if(!data||data.app!=='mikhlol'){toast('הקובץ הזה לא נראה כמו גיבוי של מכלול.');return}
  let payload=data;
  if(data.enc){
    const pw=await askPassword('גיבוי מוצפן','הזן את הסיסמה שהייתה בשימוש כשהגיבוי נוצר.');if(pw==null)return;
    try{const raw=await unwrapDEK(data.auth,pw);const key=await importDEK(raw);payload=JSON.parse(await decWith(key,ub64(data.iv),ub64(data.ct)))}catch(e){toast('הסיסמה לא פותחת את הגיבוי הזה.');return}
  }
  if(!Array.isArray(payload.systems)){toast('הגיבוי לא תקין.');return}
  const n=payload.systems.length;
  if(!await ask('לייבא את הגיבוי?',`${n===1?'מערכת אחת תתווסף':n+' מערכות יתווספו'} למכלול, כולל קבצים, גרסאות ושיחות. מערכת שכבר קיימת עם אותו מזהה תוחלף בגרסה מהגיבוי.`,'ייבא',false))return;
  try{
    for(const [id,t] of Object.entries(payload.files||{})){S.files.set(id,t);if(!S.mem)await IDB.put('files',id,t)}
    for(const [id,c] of Object.entries(payload.chats||{})){if(!S.mem)await IDB.put('chats',id,c);delete chatLoaded[id];delete S.chats[id]}
    for(const t of (payload.templates||[])){if(t&&t.id)tplSave(t)}
    for(const s of payload.systems){if(!s||!s.id)continue;delete s.link;upsertLocal(s);if(!S.mem)await IDB.put('systems',s.id,JSON.parse(JSON.stringify(s)))}
    render();toast('הגיבוי יובא');
  }catch(e){toast(idbMsg(e))}
}
let bkTimer=null;
function scheduleBackup(){clearTimeout(bkTimer);bkTimer=setTimeout(()=>runAutoBackup(false),90000)}
async function chooseBackupDir(){
  if(!DIR_OK){toast('גיבוי אוטומטי לתיקייה עובד בכרום ובאדג׳ במחשב.');return}
  try{const h=await window.showDirectoryPicker({mode:'readwrite',id:'mikhlol-backup'});await setHandle('backupDir',h);ls.set('mk-bk-name',h.name);S.bkNeedsPerm=false;await runAutoBackup(true)}catch(e){if(e&&e.name!=='AbortError')toast('לא הצלחתי לגשת לתיקייה.')}
  renderPanel();renderBanner();

async function runAutoBackup(interactive){
  const h=await getHandle('backupDir');if(!h||!S.ready)return;
  let p='prompt';try{p=await h.queryPermission({mode:'readwrite'});if(p!=='granted'&&interactive)p=await h.requestPermission({mode:'readwrite'})}catch(e){}
  if(p!=='granted'){S.bkNeedsPerm=true;renderBanner();return}
  S.bkNeedsPerm=false;
  try{
    const str=await backupString();const day=new Date().toISOString().slice(0,10);
    for(const nm of ['mikhlol-backup-latest.json',`mikhlol-backup-${day}.json`]){const fh=await h.getFileHandle(nm,{create:true});const w=await fh.createWritable();await w.write(str);await w.close()}
    const old=[];for await(const [nm] of h.entries()){const m=/^mikhlol-backup-(\d{4}-\d{2}-\d{2})\.json$/.exec(nm);if(m)old.push(nm)}old.sort();while(old.length>7){try{await h.removeEntry(old.shift())}catch(e){}}
    ls.set('mk-bk-last',String(Date.now()));if(interactive)toast('גובה לתיקייה '+h.name);
  }catch(e){if(interactive)toast('הגיבוי לתיקייה נכשל.')}
  renderBanner();if(S.view==='settings'&&!sel())renderPanel();
}

S.thumbs={};let h2cP=null;
function loadH2C(){if(window.html2canvas)return Promise.resolve(window.html2canvas);if(!h2cP)h2cP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=()=>res(window.html2canvas);sc.onerror=()=>{h2cP=null;rej(new Error('h2c'))};document.head.appendChild(sc)});return h2cP}
async function getThumb(id){if(!id)return null;if(id in S.thumbs)return S.thumbs[id];let t=null;try{if(!S.mem)t=await IDB.get('thumbs',id)}catch(e){}S.thumbs[id]=t||null;return S.thumbs[id]}
let thumbRerender=null;
function ensureThumbs(ids){const miss=ids.filter(id=>id&&!(id in S.thumbs));if(!miss.length)return;Promise.all(miss.map(getThumb)).then(r=>{if(r.some(Boolean)){clearTimeout(thumbRerender);thumbRerender=setTimeout(()=>{const act=document.activeElement;if(!(act&&$('#panel').contains(act)&&act.matches('input,textarea,select')))renderPanel()},60)}})}
function pageBg(doc){const t=c=>!c||c==='transparent'||/rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(c);try{const w=doc.defaultView;let c=w.getComputedStyle(doc.body).backgroundColor;if(t(c))c=w.getComputedStyle(doc.documentElement).backgroundColor;return t(c)?'#ffffff':c}catch(e){return '#ffffff'}}
async function captureThumb(f,id){
  if(!id||S.thumbs[id])return;
  try{const h2c=await loadH2C();const doc=f.contentDocument;if(!doc||!doc.body)return;const vw=f.clientWidth||1024,fh=f.clientHeight||700,vh=Math.min(fh,Math.round(vw*0.7));
    const c=await h2c(doc.documentElement,{x:0,y:0,scrollX:0,scrollY:0,width:vw,height:vh,windowWidth:vw,windowHeight:fh,scale:Math.min(1,520/vw),logging:false,useCORS:true,backgroundColor:pageBg(doc)});
    const url=c.toDataURL('image/jpeg',0.72);if(url.length<2000)return;S.thumbs[id]=url;if(!S.mem)await IDB.put('thumbs',id,url);
    if(!sel()||S.mode==='overview')renderPanel();
  }catch(e){}
}
function shotHTML(s,cls=''){const t=s.assetId?S.thumbs[s.assetId]:null;return t?`<img class="${cls}" src="${t}" alt="תצוגה של ${esc(s.name)}" loading="lazy">`:`<span class="ph ${cls}" style="--c:var(--${s.color||'k1'})">${esc(initial(s.name))}</span>`}

/* Claude streaming with prompt caching */
async function streamMessage(body,{signal,onText}={}){
  const k=AI.key();if(!k)throw{code:'no_key'};
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(Object.assign({model:AI.model(),max_tokens:8000,stream:true},body))})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'network'}}
  if(!r.ok){let j=null;try{j=await r.json()}catch(e){}const m=(j&&j.error&&j.error.message)||'';throw{code:httpCode(r.status,m),detail:m}}
  const rd=r.body.getReader();const dec=new TextDecoder();let buf='';const blocks=[];let stop='',usage={};
  const textNow=()=>blocks.filter(b=>b&&b.type==='text').map(b=>b.text).join('');
  try{for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let idx;
    while((idx=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,idx);buf=buf.slice(idx+2);const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;let ev;try{ev=JSON.parse(line.slice(5).trim())}catch(e){continue}
      if(ev.type==='message_start'&&ev.message)usage=Object.assign({},ev.message.usage||{});
      else if(ev.type==='content_block_start'){const b=ev.content_block||{};blocks[ev.index]=b.type==='text'?{type:'text',text:b.text||''}:b.type==='tool_use'?{type:'tool_use',id:b.id,name:b.name,input:{},_j:''}:Object.assign({},b)}
      else if(ev.type==='content_block_delta'){const b=blocks[ev.index];if(!b)continue;if(ev.delta.type==='text_delta'){b.text+=ev.delta.text;if(onText)onText(textNow())}else if(ev.delta.type==='input_json_delta')b._j+=ev.delta.partial_json||''}
      else if(ev.type==='content_block_stop'){const b=blocks[ev.index];if(b&&b.type==='tool_use'){try{b.input=b._j?JSON.parse(b._j):{}}catch(e){b.input={}}delete b._j}}
      else if(ev.type==='message_delta'){if(ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;if(ev.usage)Object.assign(usage,ev.usage)}
      else if(ev.type==='error')throw{code:ev.error&&ev.error.type==='overloaded_error'?'overloaded':'api',detail:ev.error&&ev.error.message}}}}
  catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw e}
  const u=usage;addUsage((u.input_tokens||0)+(u.cache_creation_input_tokens||0)+(u.cache_read_input_tokens||0),u.output_tokens||0,u.cache_read_input_tokens||0);
  return{content:blocks.filter(Boolean),stop_reason:stop};
}
async function runClaude(input,opts={}){
  const messages=mergeTurns(input);const tools=opts.tools||[];
  const defs=tools.map(t=>({name:t.name,description:t.description||'',input_schema:t.inputSchema||{type:'object',properties:{}}}));
  if(defs.length)defs[defs.length-1].cache_control={type:'ephemeral'};
  if(typeof messages[0].content==='string'&&messages[0].content.length>3000)messages[0].content=[{type:'text',text:messages[0].content,cache_control:{type:'ephemeral'}}];
  else if(Array.isArray(messages[0].content)&&messages.length>1){const b0=messages[0].content.find(b=>b.type==='text'&&b.text.length>3000);if(b0)b0.cache_control={type:'ephemeral'}}
  let text='',stop='';
  for(let round=0;round<30;round++){
    for(let i=1;i<messages.length;i++){const c=messages[i].content;if(Array.isArray(c))c.forEach(b=>{if(b.type==='tool_result')delete b.cache_control})}
    const last=messages[messages.length-1];if(messages.length>1&&Array.isArray(last.content)&&last.content.length)last.content[last.content.length-1].cache_control={type:'ephemeral'};
    const body={messages};if(defs.length)body.tools=defs;
    const j=await streamMessage(body,{signal:opts.signal,onText:t=>{if(t){text=t;if(opts.onText)opts.onText({text:t})}}});stop=j.stop_reason;
    const tx=j.content.filter(b=>b.type==='text').map(b=>b.text).join('');if(tx)text=tx;
    if(stop!=='tool_use')break;
    messages.push({role:'assistant',content:j.content});
    const results=[];
    for(const b of j.content.filter(b=>b.type==='tool_use')){
      const t=tools.find(x=>x.name===b.name);let out,err=false;
      try{if(!t)throw new Error('Unknown tool');out=await t.execute(b.input||{})}catch(e){out=String(e&&e.message||e);err=true}
      results.push({type:'tool_result',tool_use_id:b.id,content:Array.isArray(out)?out:String(out==null?'':out).slice(0,60000),is_error:err});
    }
    messages.push({role:'user',content:results});
  }
  return{text,truncated:stop==='max_tokens'};
}

function saveState(sid){

  try{const w=f.contentWindow,doc=f.contentDocument;if(!w||!doc||!doc.body)return;const els=[];
    const all=doc.body.getElementsByTagName('*');for(let i=0;i<all.length&&els.length<6;i++){const n=all[i];if(n.scrollTop>0||n.scrollLeft>0)els.push({p:cssPath(n),t:n.scrollTop,l:n.scrollLeft})}

async function resizeImage(file){

    const max=1568;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);

function ghHas(){return !!S.ghToken}

async function gh(path,opts={}){
  if(!S.ghToken)throw Object.assign(new Error('צריך לחבר את GitHub בהגדרות.'),{status:0});
  let r;try{r=await fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+S.ghToken,'X-GitHub-Api-Version':'2022-11-28'},opts.body?{'Content-Type':'application/json'}:{}),body:opts.body?JSON.stringify(opts.body):undefined})}
  catch(e){throw Object.assign(new Error('אין חיבור ל-GitHub. בדוק את האינטרנט.'),{status:-1})}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const m=r.status===401?'הטוקן של GitHub לא תקין או שפג תוקפו. עדכן אותו בהגדרות.':r.status===403?'לטוקן אין הרשאה לפעולה הזו.':r.status===404?'לא נמצא, או שלטוקן אין גישה לריפו הזה.':((j&&j.message)||('שגיאה מ-GitHub ('+r.status+')'));throw Object.assign(new Error(m),{status:r.status})}
  return j;
}
function utf8b64(str){return b64(new TextEncoder().encode(str))}

async function ghPublish(s,silent){
  const g=s.gh;if(!g)return;if(!s.assetId){toast('אין קובץ לפרסם.');return}
  if(S.ghBusy===s.id)return;S.ghBusy=s.id;if(sel()&&S.mode==='overview')renderPanel();
  try{
    const text=await getFile(s.assetId);const dir=g.path.includes('/')?g.path.slice(0,g.path.lastIndexOf('/')):'';const name=g.path.split('/').pop();
    let sha;try{const L=await gh(`/repos/${g.owner}/${g.repo}/contents/${dir}?ref=${encodeURIComponent(g.branch)}`);const f=Array.isArray(L)&&L.find(x=>x.name===name);if(f)sha=f.sha}catch(e){if(e.status!==404)throw e}
    const v=(s.versions||[])[0];
    await gh(`/repos/${g.owner}/${g.repo}/contents/${g.path.split('/').map(encodeURIComponent).join('/')}`,{method:'PUT',body:Object.assign({message:`מכלול: ${s.name}${v&&v.note?' – '+v.note.slice(0,60):''}`,content:utf8b64(text),branch:g.branch},sha?{sha}:{})});
    let url=g.url;
    try{const p=await gh(`/repos/${g.owner}/${g.repo}/pages`);url=p.html_url}catch(e){
      if(e.status===404){try{const p=await gh(`/repos/${g.owner}/${g.repo}/pages`,{method:'POST',body:{source:{branch:g.branch,path:'/'}}});url=p.html_url}catch(x){}}
    }
    if(url&&name!=='index.html')url=url.replace(/\/?$/,'/')+g.path;
    await mutate(s.id,ns=>{ns.gh=Object.assign({},ns.gh,{url:url||ns.gh.url||'',at:Date.now(),asset:s.assetId})});
    toast(silent?'גם האתר ב-GitHub עודכן':'פורסם. האתר יתעדכן תוך דקה-שתיים.');
  }catch(e){toast(e.message||'הפרסום ל-GitHub נכשל.')}
  S.ghBusy=null;if(sel()&&S.mode==='overview')renderPanel();
}

/* recommendations: Claude reads the catalog and the office description */

  S.recBusy=true;renderPanel();
  try{
    const r=await S.sample.json(`You help an office in the Israeli construction and real-estate industry choose which ready-made systems to install. Office type: ${S.libType==='all'?'not specified':typeName(S.libType)}. The office describes itself (Hebrew): "${txt}".

/* ===== v10: per-system storage isolation and split screen ===== */
function storageShim(sid,legacy){
  const P=JSON.stringify('mks:'+sid+':');
  return '<scr'+`ipt>(function(){try{var P=${P},L=${legacy?'true':'false'},R=window.localStorage,T=P+'\\u0000del:';
function own(k){return k.indexOf('mk-')===0||k.indexOf('hub-')===0||k.indexOf('mks:')===0}
function keys(){var o=[],seen={};for(var i=0;i<R.length;i++){var k=R.key(i);if(k.indexOf(P)===0&&k.indexOf(T)!==0){var n=k.slice(P.length);seen[n]=1;o.push(n)}}if(L){for(var j=0;j<R.length;j++){var q=R.key(j);if(!own(q)&&!seen[q]&&R.getItem(T+q)===null)o.push(q)}}return o}
var api={getItem:function(k){k=String(k);var v=R.getItem(P+k);if(v!==null)return v;if(L&&!own(k)&&R.getItem(T+k)===null)return R.getItem(k);return null},
setItem:function(k,v){k=String(k);R.setItem(P+k,String(v));R.removeItem(T+k)},
removeItem:function(k){k=String(k);R.removeItem(P+k);if(L&&!own(k)&&R.getItem(k)!==null)R.setItem(T+k,'1')},
clear:function(){keys().forEach(function(k){api.removeItem(k)})},key:function(i){return keys()[i]||null}};
var px=new Proxy(api,{get:function(t,p){if(p==='length')return keys().length;if(typeof p==='symbol'||p in api)return api[p];var v=api.getItem(p);return v===null?undefined:v},
set:function(t,p,v){api.setItem(p,v);return true},deleteProperty:function(t,p){api.removeItem(p);return true},
has:function(t,p){return p in api||api.getItem(p)!==null},ownKeys:function(){return keys()},getOwnPropertyDescriptor:function(t,p){var v=api.getItem(p);return v===null?undefined:{value:v,writable:true,enumerable:true,configurable:true}}});
Object.defineProperty(window,'localStorage',{value:px,configurable:true});
var I=window.indexedDB;if(I){var o=I.open.bind(I),d=I.deleteDatabase.bind(I);Object.defineProperty(window,'indexedDB',{value:{open:function(n,v){return v===undefined?o(P+n):o(P+n,v)},deleteDatabase:function(n){return d(P+n)},cmp:I.cmp.bind(I),databases:I.databases?function(){return I.databases().then(function(a){return a.filter(function(x){return x.name.indexOf(P)===0}).map(function(x){return{name:x.name.slice(P.length),version:x.version}})})}:undefined},configurable:true})}
}catch(e){}})();<\/scr`+'ipt>';
}
function instrumentFor(html,tok,s){const h=instrument(html,tok);if(!s||!s.id)return h;const shim=storageShim(s.id,s.iso!==2);const m=/<head[^>]*>/i.exec(h);if(m)return h.slice(0,m.index+m[0].length)+shim+h.slice(m.index+m[0].length);const x=/<html[^>]*>/i.exec(h);if(x)return h.slice(0,x.index+x[0].length)+shim+h.slice(x.index+x[0].length);return shim+h}
function clearSysData(id){try{const P='mks:'+id+':';const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(P)===0)ks.push(k)}ks.forEach(k=>localStorage.removeItem(k));if(indexedDB.databases)indexedDB.databases().then(a=>a.filter(x=>x.name&&x.name.indexOf(P)===0).forEach(x=>indexedDB.deleteDatabase(x.name))).catch(()=>{})}catch(e){}}

const KIT_SQL="-- ============================================================\n-- מכלול · ערכת תשתית v2\n-- מריצים פעם אחת בפרויקט Supabase של המערכת (SQL Editor → Run).\n-- בטוח להריץ שוב: לא מוחק נתונים.\n-- ============================================================\n\ncreate table if not exists public.mk_platform_admins(\n  user_id uuid primary key,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.mk_orgs(\n  id uuid primary key default gen_random_uuid(),\n  name text not null,\n  status text not null default 'active' check (status in ('active','trial','past_due','locked')),\n  plan text not null default 'basic',\n  locked_reason text,\n  trial_ends date,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.mk_members(\n  org_id uuid not null references public.mk_orgs(id) on delete cascade,\n  user_id uuid not null,\n  email text,\n  display_name text,\n  role text not null default 'member' check (role in ('owner','admin','member','viewer')),\n  status text not null default 'active' check (status in ('active','blocked')),\n  session_epoch int not null default 0,\n  last_seen timestamptz,\n  created_at timestamptz not null default now(),\n  primary key(org_id,user_id)\n);\ncreate table if not exists public.mk_invites(\n  id uuid primary key default gen_random_uuid(),\n  org_id uuid not null references public.mk_orgs(id) on delete cascade,\n  email text not null,\n  role text not null default 'member' check (role in ('owner','admin','member','viewer')),\n  created_at timestamptz not null default now(),\n  claimed_at timestamptz\n);\ncreate table if not exists public.mk_settings(\n  key text primary key,\n  value jsonb,\n  updated_at timestamptz not null default now()\n);\ncreate table if not exists public.mk_kv(\n  org_id uuid not null references public.mk_orgs(id) on delete cascade,\n  key text not null,\n  value text,\n  updated_at timestamptz not null default now(),\n  updated_by uuid,\       <ol class="ccsteps sm"><li>ב-Supabase פותחים את <b>SQL Editor</b> ושאילתה חדשה.</li><li>לוחצים כאן <b>העתק</b>, מדביקים שם ולוחצים <b>Run</b>.</li><li>חוזרים ולוחצים <b>בדוק</b>.</li></ol>

          else j=await ccAuth(c,'token?grant_type=password',{email:em,password:pw});

          $('#layer').innerHTML='';S.cc.sys=s.id;S.cc.tab='conn';S.cc.data[s.id]=null;S.cc.err[s.id]=null;setView('control');toast('המערכת מחוברת למרכז השליטה')}
        catch(e){$('#ccErr').textContent=ccErrMsg(e);btn.disabled=false}};
      $('#ccIn').onclick=()=>go(false);$('#ccReg').onclick=()=>go(true);$('#ccBack2').onclick=()=>{step=c.installed?1:2;draw()}}
    const f=b.querySelector('input');if(f)f.focus()};
  draw();
}
function atobSafe(k){try{return atob((k.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/'))}catch(e){return ''}}

        const org=$('#f2').value;await cc(s,'mk_invites',{method:'POST',body:{org_id:org,email:em,role:$('#f3').value},headers:{Prefer:'return=minimal'}});

    case 'lock':ccForm('נעילת חשבון',`<p class="empty" style="margin:0 0 10px">כל המשתמשים בחשבון לא יוכלו להיכנס עד שתשחרר. הנתונים נשמרים.</p><div class="field"><label for="f1">סיבה שתוצג ללקוח (לא חובה)</label><input class="inp" id="f1" placeholder="התשלום החודשי לא התקבל"></div>`,'נעל',async()=>{await cc(s,'mk_orgs?id=eq.'+D.id,{method:'PATCH',body:{status:'locked',locked_reason:$('#f1').value.trim()||null},headers:{Prefer:'return=minimal'}});await done('החשבון ננעל')});break;

    case 'delorg':{const o=d.orgs.find(x=>x.id===D.id);if(!o)return;if(!await ask('למחוק את החשבון "'+o.name+'"?','כל המשתמשים והנתונים של החשבון יימחקו מהשרת לצמיתות. כדאי להוריד גיבוי קודם.','מחק לצמיתות',true))return;await cc(s,'mk_orgs?id=eq.'+o.id,{method:'DELETE'});await done('החשבון נמחק');break}

  }}catch(e){toast(ccErrMsg(e))}

async function ccSelect(el){const s=byId(el.dataset.sid)||byId(S.cc.sys);if(!s)return;const v=el.value,k=el.dataset.ccsel;
  if(k==='filterorg'){S.cc.filterOrg=v;renderPanel();return}

    else if(k==='orgplan'){await cc(s,'mk_orgs?id=eq.'+el.dataset.id,{method:'PATCH',body:{plan:v.trim()||'basic'},headers:{Prefer:'return=minimal'}});toast('המסלול עודכן')}
    else if(k==='role'){await cc(s,`mk_members?org_id=eq.${el.dataset.org}&user_id=eq.${el.dataset.user}`,{method:'PATCH',body:{role:v},headers:{Prefer:'return=minimal'}});toast('התפקיד עודכן')}
    ccLoad(s,true)}catch(e){toast(ccErrMsg(e));ccLoad(s,true)}}
async function ccSaveMaint(){const s=byId(S.cc.sys);if(!s)return;const on=$('#ccMaintOn').checked,msg=$('#ccMaintMsg').value.trim();
  if(on&&!await ask('להעביר את המערכת לתחזוקה?','כל הלקוחות ינותקו תוך דקה ויראו את ההודעה. רק אתה תוכל להיכנס.','הפעל תחזוקה',true)){$('#ccMaintOn').checked=false;return}
  try{await cc(s,'mk_settings?key=eq.maintenance',{method:'PATCH',body:{value:{on,message:msg},updated_at:new Date().toISOString()},headers:{Prefer:'return=minimal'}});toast(on?'המערכת במצב תחזוקה':'המערכת פתוחה ללקוחות');ccLoad(s,true)}catch(e){toast(ccErrMsg(e))}}
async function ccAll(s,path){let out=[],off=0;for(;;){const r=await cc(s,path+(path.includes('?')?'&':'?')+'limit=1000&offset='+off)||[];out=out.concat(r);if(r.length<1000||off>200000)break;off+=1000}return out}
async function ccBackup(s){toast('מכין גיבוי…');
  const t={};for(const [n,p] of [['mk_orgs','mk_orgs?select=*&order=created_at'],['mk_members','mk_members?select=*&order=created_at'],['mk_invites','mk_invites?select=*&order=created_at'],['mk_settings','mk_settings?select=*'],['mk_kv','mk_kv?select=*&order=org_id,key'],['mk_audit','mk_audit?select=*&order=id.desc']])t[n]=await ccAll(s,p);
  const name=`${cleanName(s.name).replace(/\s+/g,'-')}-cloud-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`;
  await S.downloads.save({filename:name,data:JSON.stringify({app:'mikhlol-cloud-backup',version:1,system:s.name,project:s.cloud.url,at:new Date().toISOString(),tables:t}),mimeType:'application/json'});
  await mutate(s.id,ns=>{ns.cloud=Object.assign({},ns.cloud,{lastBackup:Date.now()})});toast(`הגיבוי ירד: ${t.mk_orgs.length} חשבונות, ${t.mk_members.length} משתמשים, ${t.mk_kv.length} רשומות`)}
async function ccMigrate(s,org){if(!org){toast('בחר חשבון.');return}
  const P='mks:'+s.id+':',rows=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(P)===0&&k.indexOf(P+'\u0000del:')!==0)rows.push({org_id:org,key:k.slice(P.length),value:localStorage.getItem(k)})}
  if(s.iso!==2){const own=k=>/^(mk-|hub-|mks:|mkc:|mk_)/.test(k);for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!own(k)&&!rows.some(r=>r.key===k)&&localStorage.getItem(P+'\u0000del:'+k)===null)rows.push({org_id:org,key:k,value:localStorage.getItem(k)})}}
  if(!rows.length){toast('לא נמצאו נתונים שמורים של המערכת הזו במכלול.');return}
  if(!await ask(`להעלות ${rows.length} רשומות לענן?`,'רשומות עם אותו שם שכבר קיימות בחשבון יוחלפו.','העלה',false))return;
  for(let i=0;i<rows.length;i+=200)await cc(s,'mk_kv?on_conflict=org_id,key',{method:'POST',body:rows.slice(i,i+200),headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});

    case 'copyremind':{const o=d.orgs.find(x=>x.id===D.id);const b=ccBiz();const link=(s.gh&&s.gh.url)||s.url||'';const txt=`שלום, לא קיבלנו את התשלום החודשי עבור ${s.name}${ccPrice(s,o.plan)?` (${ccPrice(s,o.plan)} ₪)`:''}. כדי שהשירות ימשיך בלי הפרעה, אפשר להסדיר את התשלום${b.phone?' מול '+b.phone:''}. תודה${b.name?', '+b.name:''}.${link?'\n'+link:''}`;try{await navigator.clipboard.writeText(txt);toast('התזכורת הועתקה, שלח אותה ללקוח')}catch(e){toast('לא הצלחתי להעתיק')}return true}
    case 'markpaid':await cc(s,'mk_orgs?id=eq.'+D.id,{method:'PATCH',body:{status:'active',locked_reason:null},headers:{Prefer:'return=minimal'}});await done('סומן כשולם');return true;
    case 'markdue':await cc(s,'mk_orgs?id=eq.'+D.id,{method:'PATCH',body:{status:'past_due'},headers:{Prefer:'return=minimal'}});await done('סומן בפיגור');return true;
    case 'saveorg':{const body={plan:$('#poPlan').value.trim()||'basic',status:$('#poSt').value,trial_ends:$('#poTrial').value||null};if($('#poRenew'))body.renew_on=$('#poRenew').value||null;if(body.status!=='locked')body.locked_reason=null;await cc(s,'mk_orgs?id=eq.'+D.id,{method:'PATCH',body,headers:{Prefer:'return=minimal'}});await done('נשמר');return true}
    case 'savenotes':await cc(s,'mk_orgs?id=eq.'+D.id,{method:'PATCH',body:{notes:$('#poNotes').value},headers:{Prefer:'return=minimal'}});await done('ההערה נשמרה');return true;
    case 'saveann':{const v={on:$('#anOn').checked,text:$('#anTxt').value.trim(),until:$('#anUntil').value||''};if(v.on&&!v.text){toast('כתוב נוסח להודעה.');return true}await cc(s,'mk_settings?on_conflict=key',{method:'POST',body:{key:'announcement',value:v},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});await done(v.on?'ההודעה תוצג ללקוחות':'ההודעה הוסתרה');return true}
    case 'addplan':case 'delplan':case 'saveplans':{const rows=[...document.querySelectorAll('#plansTbl tbody tr')].map(tr=>{const o={};tr.querySelectorAll('[data-pf]').forEach(x=>{o[x.dataset.pf]=x.value.trim()});return o});
      if(act==='addplan'){rows.push({name:'',month:'',year:'',seats:'',features:''});d.settings.plans=rows;renderPanel();return true}
      if(act==='delplan'){rows.splice(+D.id,1);d.settings.plans=rows;renderPanel();return true}

    case 'savedun':ls.set('mk-dunning',JSON.stringify({days:Math.max(1,+$('#dnDays').value||7),remind:$('#dnRemind').checked,approve:true}));toast('נשמר');renderPanel();return true;

    case 'gotolog':S.cc.page='safety';S.cc.sub.safety='log';S.cc.sys=s.id;renderPanel();return true;
    case 'gotolegal':S.cc.page='settings';S.cc.sub.settings='legal';renderPanel();return true;

    case 'migrate2':ccForm('העברת נתונים לענן',`<div class="field"><label for="f1">לאיזה לקוח</label><select class="inp" id="f1" style="width:100%">${d.orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div>`,'המשך',async()=>{const org=$('#f1').value;setTimeout(()=>ccMigrate(s,org),0)});return true;
    case 'restore':ccForm('שחזור של לקוח מקובץ גיבוי',`<p class="empty" style="margin:0 0 10px">בוחרים קובץ גיבוי שהורד ממרכז השליטה, ואת הלקוח. רק הנתונים שלו יוחלפו בנתונים מהקובץ.</p><div class="field"><label for="f1">קובץ גיבוי</label><input class="inp" id="f1" type="file" accept=".json,application/json"></div><div class="field"><label for="f2">לקוח</label><select class="inp" id="f2" style="width:100%">${d.orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div>`,'תצוגה מקדימה',async()=>{const f=$('#f1').files[0];if(!f){$('#cfErr').textContent='בחר קובץ.';return false}let j;try{j=JSON.parse(await f.text())}catch(e){$('#cfErr').textContent='הקובץ לא נקרא.';return false}
      if(!j||j.app!=='mikhlol-cloud-backup'||!j.tables){$('#cfErr').textContent='זה לא קובץ גיבוי של מרכז השליטה.';return false}const org=$('#f2').value;const rows=(j.tables.mk_kv||[]).filter(r=>r.org_id===org);const cur=await ccAll(s,'mk_kv?select=key&org_id=eq.'+org);
      setTimeout(async()=>{if(!await ask(`לשחזר ${rows.length} רשומות?`,`יש היום ${cur.length} רשומות ללקוח הזה. הן יוחלפו בגרסה מ-${j.at?fmtDate(new Date(j.at).getTime()):'הגיבוי'}. רשומות שלא היו בגיבוי יימחקו. כדאי להוריד גיבוי של המצב הנוכחי קודם.`,'שחזור',true))return;
        try{await cc(s,'mk_kv?org_id=eq.'+org,{method:'DELETE'});for(let i=0;i<rows.length;i+=200)await cc(s,'mk_kv?on_conflict=org_id,key',{method:'POST',body:rows.slice(i,i+200).map(r=>({org_id:org,key:r.key,value:r.value})),headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});await done('השחזור הושלם')}catch(e){toast(ccErrMsg(e))}},0)});return true;
  }}catch(e){toast(ccErrMsg(e));return true}
  return false}

async function ccLoad(s,force){return ccLoad2(s,force)}

/* dialogs */
function ask(title,body,ok,danger){
  return new Promise(res=>{
    $('#layer').innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dt"><h3 id="dt">${esc(title)}</h3><p style="margin:0 0 16px;color:var(--muted)">${esc(body)}</p><div class="acts"><button class="btn ${danger?'danger':'primary'}" id="dOk">${esc(ok)}</button><button class="btn" id="dNo">ביטול</button></div></div></div>`;
    const done=v=>{$('#layer').innerHTML='';res(v)};
    $('#dOk').onclick=()=>done(true);$('#dNo').onclick=()=>done(false);
    $('#ov').onclick=e=>{if(e.target.id==='ov')done(false)};$('#dOk').focus();
  });
}
function openAdd(){
  let file=null,handle=null;
  $('#layer').innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="at">
  <h3 id="at">הוספת מערכת</h3>
  ${S.templates.length?`<button class="buildcta" data-view="library">${ic('books',20)}<span><b>התקן מערכת מהספרייה</b><small>${S.templates.length===1?'מערכת מוכנה אחת':S.templates.length+' מערכות מוכנות'} לענף, מותאמות למשרד</small></span></button><div style="height:8px"></div>`:''}<button class="buildcta" id="buildBtn">${ic('wand',20)}<span><b>בנה מערכת חדשה עם Claude</b><small>מתארים מה צריך, ו-Claude כותב את כל הקובץ</small></span></button>
  <div class="orline"><span>או הוסף מערכת קיימת</span></div>
  <div class="field"><label>קובץ HTML</label><label class="drop" id="drop">${ic('file',22)}<span id="dropTxt">בחר קובץ מהמכשיר</span><input type="file" id="fileIn" accept=".html,.htm,text/html" hidden></label></div>
  ${FS_OK?'<label class="chk"><input type="checkbox" id="linkChk" checked> קשר לקובץ המקורי במחשב, כדי לסנכרן שינויים בשני הכיוונים</label>':''}
  <div class="field"><label for="urlIn">כתובת חיה (לא חובה אם יש קובץ)</label><input class="inp" id="urlIn" dir="ltr" placeholder="https://ilan.github.io/system" inputmode="url"></div>
  <div class="field"><label for="nameIn">שם המערכת</label><input class="inp" id="nameIn" placeholder="קבוצת המשכן"></div>
  <div class="err" id="addErr"></div>
  <div class="acts"><button class="btn primary" id="addGo">הוסף מערכת</button><button class="btn" id="addNo">ביטול</button></div></div></div>`;
  const close=()=>{$('#layer').innerHTML=''};
  $('#addNo').onclick=close;$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
  if(FS_OK)$('#drop').onclick=async e=>{e.preventDefault();try{handle=await pickHtmlHandle();file=await handle.getFile();$('#dropTxt').textContent=file.name+' ('+kb(file.size)+')';$('#drop').classList.add('has');if(!$('#nameIn').value)$('#nameIn').value=cleanName(file.name);$('#addErr').textContent=''}catch(x){}};
  $('#fileIn').onchange=e=>{file=e.target.files[0]||null;handle=null;if(file){$('#dropTxt').textContent=file.name+' ('+kb(file.size)+')';$('#drop').classList.add('has');if(!$('#nameIn').value)$('#nameIn').value=cleanName(file.name)}$('#addErr').textContent=''};
  ['#urlIn','#nameIn'].forEach(q=>$(q).oninput=()=>{$('#addErr').textContent=''});
  $('#addGo').onclick=async()=>{
    const name=$('#nameIn').value.trim();let url=$('#urlIn').value.trim();
    if(!file&&!url){$('#addErr').textContent='בחר קובץ HTML או הזן כתובת.';return}
    if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
    if(url){try{new URL(url)}catch(e){$('#addErr').textContent='הכתובת לא תקינה. בדוק אותה ונסה שוב.';return}}
    if(!name){$('#addErr').textContent='תן למערכת שם.';return}
    const linkOn=!!(handle&&$('#linkChk')&&$('#linkChk').checked);
    const btn=$('#addGo');btn.disabled=true;btn.textContent='מעלה…';
    try{
      let assetId=null,text=null;
      if(file){text=await file.text();assetId=await putFile(text)}
      const s={id:uid(),iso:2,name,url:url||'',assetId,draftAssetId:null,draftMeta:null,tasks:[],notes:'',versions:assetId?[{assetId,at:Date.now(),note:'העלאה ראשונה'}]:[],createdAt:Date.now()};
      if(text!=null){s.size=bytes(text);s.lines=text.split('\n').length;learn(s,text)}
      if(linkOn){await setHandle('sys:'+s.id,handle);s.link={name:file.name,mod:file.lastModified};S.disk[s.id]={perm:'granted',changed:false}}
      close();S.view='sys';S.selId=s.id;S.mode='overview';await saveSys(s);toast('המערכת נוספה');
    }catch(e){btn.disabled=false;btn.textContent='הוסף מערכת';$('#addErr').textContent=e.message||'ההוספה נכשלה.'}
  };
}

/* events */
function openSys(id,mode){{const pv=sel();if(pv&&pv.id!==id)saveState(pv.id)}{const sx=byId(id);if(sx&&sx.link)checkDisk(sx,false)}if((mode||'overview')==='work')loadChat(id);S.view='sys';S.selId=id;S.mode=mode||'overview';S.previewWhich='draft';if(S.mode==='work')S.wsTab='chat';ls.set('hub-nav',JSON.stringify({view:'sys',id}));render();if(S.mode==='work')renderChat();$('#panel').scrollTop=0}
function setView(v){if(S.focus){S.focus=false;$('#fbar').innerHTML='';try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}S.view=v;ls.set('hub-nav',JSON.stringify({view:v}));render();$('#panel').scrollTop=0}
function splitRef(r){const i=r.indexOf(':');return[r.slice(0,i),r.slice(i+1)]}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],label,a,[data-tab],[data-cccust]');if(!t)return;
  const D=t.dataset;
  if((D.swto||D.tab||D.open||D.view)&&S.mode==='code'&&edDirty)await leaveCodeIfDirty();
  if(D.splitto){splitTo(D.splitto);return}
  if(D.swto){switchTo(D.swto);return}
  if(D.imgdel!==undefined){const x=sel();if(x&&S.imgs[x.id]){S.imgs[x.id].splice(+D.imgdel,1);renderImgStrip()}return}
  if(D.tabclose){closeTab(D.tabclose);return}
  if(D.tab){if(!sel()||sel().id!==D.tab)switchTo(D.tab);return}
  if(D.cmpmode){S.cmpMode=D.cmpmode;ls.set('mk-cmp',S.cmpMode);render();return}
  if(D.settheme){setTheme(D.settheme);return}

  if(D.task){const[sid,tid]=splitRef(D.task);mutate(sid,ns=>{const k=ns.tasks.find(x=>x.id===tid);if(k){k.done=!k.done;k.status=k.done?'done':'todo';k.doneAt=k.done?Date.now():null}});return}

  if(D.health&&s){healthCheck(s);return}
  if((D.ftask||D.ffix||D.fdrop)&&s&&s.health){const fid=D.ftask||D.ffix||D.fdrop;const f=(s.health.findings||[]).find(x=>x.id===fid);if(!f)return;
    if(D.ftask){mutate(s.id,ns=>{ns.tasks=[...(ns.tasks||[]),{id:uid(),text:f.title+': '+f.detail,done:false,createdAt:Date.now(),pri:f.severity==='high'?'high':null}];const g=ns.health.findings.find(x=>x.id===fid);if(g)g.tasked=true});toast('נוסף למשימות');return}
    if(D.fdrop){mutate(s.id,ns=>{ns.health.findings=ns.health.findings.filter(x=>x.id!==fid)});return}

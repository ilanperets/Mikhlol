  if(D.restore&&s){const v=s.versions[+D.restore];if(!v)return;if(!await ask('לשחזר את הגרסה?','הגרסה הזו תהפוך לגרסה הנוכחית. הגרסה הנוכחית תישאר ברשימה.','שחזר',false))return;mutate(s.id,ns=>{ns.assetId=v.assetId;ns.size=null;ns.lines=null;ns.versions=[{assetId:v.assetId,at:Date.now(),note:'שוחזר מגרסה מ-'+fmtDate(v.at)},...ns.versions].slice(0,60)});toast('הגרסה שוחזרה');syncOut(s.id);return}
  switch(t.id){
    case 'reloadStage':reloadActive();break;

    case 'errBtn':if(s)openErrs(s);break;
    case 'buildBtn':openBuild();break;
    case 'dlStage':if(s)download(s,S.mode==='work'&&S.previewWhich==='draft'&&s.draftAssetId?s.draftAssetId:s.assetId);break;
    case 'sendBtn':send();break;
    case 'stopBtn':if(S.ctl)S.ctl.abort();break;
    case 'undoEdit':undoEdit();break;
    case 'dropDraft':dropDraft();break;
    case 'publish':publish();break;
    case 'addTask':if(s)addTask(s.id,$('#newTask'),$('#newDue'));break;
    case 'gAdd':addTask($('#gSys').value,$('#gTask'),$('#gDue'));break;
    case 'codeGo':codeSearch();break;
    case 'openWin':if(s)openWindow(s);break;
    case 'saveKey':{const k=($('#apiKey').value||'').trim();if(k&&!/^sk-/.test(k)){$('#keyErr').textContent='זה לא נראה כמו מפתח API של Anthropic. מפתח מתחיל ב-sk-.';return}await setApiKey(k);ls.set('mk-model',$('#apiModel').value);$('#keyErr').textContent='';document.activeElement.blur();render();toast(k?'המפתח נשמר':'המפתח הוסר');break}
    case 'testKey':{const k=($('#apiKey').value||'').trim();if(!k){$('#keyErr').textContent='הדבק מפתח קודם.';return}await setApiKey(k);ls.set('mk-model',$('#apiModel').value);t.disabled=true;t.textContent='בודק…';try{await runClaude('ענה במילה אחת: תקין');toast('החיבור ל-Claude תקין');$('#keyErr').textContent=''}catch(x){$('#keyErr').textContent=sampleMsg(x)}render();break}
    case 'clearKey':if(await ask('למחוק את המפתח?','העבודה עם Claude תיעצר עד שתדביק מפתח חדש.','מחק מפתח',true)){await setApiKey('');render()}break;
    case 'resetUsage':ls.set('mk-usage',JSON.stringify({in:0,out:0,calls:0,since:Date.now()}));renderPanel();break;
    case 'wipeAll':wipeAll();break;
    case 'agGo':runAgent();break;
    case 'ccBack':S.cc.sys=null;renderPanel();break;
    case 'ccRefresh':{const x=byId(S.cc.sys);if(x)ccLoad(x,true);break}
    case 'ccRefreshAll':ccLoadAllStats(true);break;
    case 'ccRefreshAll2':for(const x of ccSys()){S.cc.err[x.id]=null;ccLoad2(x,true)}if(S.cc.kit)for(const x of ccSys())delete S.cc.kit[x.id];renderPanel();break;
    case 'ccMaintSave':ccSaveMaint();break;
    case 'ccLogin':{const x=byId(S.cc.sys);if(!x)break;const em=$('#ccEm').value.trim().toLowerCase(),pw=$('#ccPw').value;t.disabled=true;try{const j=await ccAuth(x.cloud,'token?grant_type=password',{email:em,password:pw});await ccKeep(x,j);S.cc.err[x.id]=null;S.cc.errCode=null;S.cc.data[x.id]=null;ccLoad(x,true)}catch(e){$('#ccLErr').textContent=ccErrMsg(e);t.disabled=false}break}
    case 'agCancel':S.agentRun=null;renderPanel();break;
    case 'agStop':if(S.agentRun&&S.agentRun.ctl)S.agentRun.ctl.abort();break;
    case 'agClose':S.agentRun=null;renderPanel();break;
    case 'agNew':openAgentEdit(null);break;
    case 'splitBtn':openSplitPicker(t);break;
    case 'splitSwap':splitSwap();break;
    case 'splitClose':splitClose();break;

    case 'recBtn':recommend();break;
    case 'libExport':exportLibrary();break;
    case 'edSave':saveEditor();break;
    case 'edRevert':revertEditor();break;
    case 'edFind':if(CM){CM.focus();CM.execCommand('findPersistent')}else{const q=window.prompt('מה לחפש?');if(q&&!ED.find(q))toast('לא נמצא.')}break;
    case 'edLine':if(CM){CM.focus();CM.execCommand('jumpToLine')}else{const n=parseInt(window.prompt('לאיזו שורה?')||'');if(n)ED.line(n)}break;
    case 'ghLink':if(s)ghLink(s);break;
    case 'ghPub':if(s)ghPublish(s);break;
    case 'ghUnlink':if(s&&await ask('לנתק מ-GitHub?','המערכת תפסיק להתפרסם לריפו. האתר עצמו והריפו לא יימחקו.','נתק',false))mutate(s.id,ns=>{delete ns.gh});break;
    case 'ghSave':{const v=($('#ghTok').value||'').trim();await setGhToken(v);$('#ghTokErr').textContent='';renderPanel();renderSide();toast(v?'הטוקן נשמר':'החיבור ל-GitHub הוסר');break}
    case 'ghTest':{const v=($('#ghTok').value||'').trim();if(!v){$('#ghTokErr').textContent='הדבק טוקן קודם.';return}await setGhToken(v);t.disabled=true;try{const u=await gh('/user');S.ghUser=u.login;$('#ghTokErr').textContent='';toast('מחובר ל-GitHub בתור '+u.login);renderPanel()}catch(x){$('#ghTokErr').textContent=x.message;t.disabled=false}break}

function addTask(sid,inp,dueEl){if(!inp||!sid)return;const v=inp.value.trim();if(!v){inp.focus();return}const due=dueEl&&dueEl.value||null;inp.value='';if(dueEl)dueEl.value='';inp.blur();mutate(sid,ns=>{ns.tasks=[...(ns.tasks||[]),{id:uid(),text:v,done:false,status:'todo',due,createdAt:Date.now()}]})}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#swMenu')){$('#swMenu').remove();return}
  if(e.key==='Escape'&&S.focus&&!$('#ov')){exitFocus();return}
  if((e.key==='f'||e.key==='F'||e.code==='KeyF')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!(e.target.matches&&e.target.matches('input,textarea,select,[contenteditable]'))&&canFocus()&&!$('#ov')&&!S.pal){e.preventDefault();S.focus?exitFocus():enterFocus();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K'||e.code==='KeyK')){e.preventDefault();if(S.pal)closePal();else openPalette();return}
  if(S.pal){if(e.key==='ArrowDown'){e.preventDefault();S.pal.i=Math.min(S.pal.items.length-1,S.pal.i+1);palRender()}else if(e.key==='ArrowUp'){e.preventDefault();S.pal.i=Math.max(0,S.pal.i-1);palRender()}else if(e.key==='Enter'&&!e.isComposing){e.preventDefault();runPal(S.pal.i)}else if(e.key==='Escape'){closePal()}return}
  if(e.target.id==='chatText'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.innerWidth>860){e.preventDefault();send()}
  if(e.key==='Enter'&&!e.isComposing){const s=sel();if(e.target.id==='newTask'&&s){e.preventDefault();addTask(s.id,e.target,$('#newDue'))}if(e.target.id==='gTask'){e.preventDefault();addTask($('#gSys').value,e.target,$('#gDue'))}if(e.target.id==='codeQ'){e.preventDefault();codeSearch()}}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-open]')){openSys(e.target.dataset.open)}
  if(e.key==='Escape'&&$('#ov'))$('#layer').innerHTML='';
});
document.addEventListener('input',e=>{if(e.target.id==='chatText')autoGrow(e.target)});
document.addEventListener('focusout',e=>{
  const s=sel();if(!s)return;
  if(e.target.id==='notes'){const v=e.target.value;if(v!==(s.notes||''))setTimeout(()=>mutate(s.id,ns=>{ns.notes=v}))}
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.agitem!==undefined&&S.agentRun){S.agentRun.items[+e.target.dataset.agitem].on=e.target.checked;const g=$('#agGo');if(g)g.disabled=!S.agentRun.items.some(x=>x.on!==false);return}
  if(e.target.dataset&&e.target.dataset.ccsel){ccSelect(e.target);return}
  if(e.target.id==='ccSysSel'){S.cc.sys=e.target.value||null;S.cc.cust=null;renderPanel();return}
  if(e.target.dataset&&e.target.dataset.ccsec){const x=byId(e.target.dataset.sid);const m=ccSecMan(x);m[e.target.dataset.ccsec]=e.target.checked;ls.set('mk-secchk:'+x.id,JSON.stringify(m));renderPanel();return}
  if(e.target.dataset&&e.target.dataset.cccomp){const x=byId(e.target.dataset.sid),dd=ccD(x);if(!dd)return;const c=Object.assign({},dd.settings.compliance||{});c[e.target.dataset.cccomp]=e.target.value;dd.settings.compliance=c;cc(x,'mk_settings?on_conflict=key',{method:'POST',body:{key:'compliance',value:c},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}}).then(()=>toast('נשמר')).catch(er=>toast(ccErrMsg(er)));return}
  if(e.target.id==='libImport'){const f=e.target.files[0];e.target.value='';if(f)importLibrary(f);return}
  if(e.target.id==='imgIn'){const f=[...e.target.files];e.target.value='';addImages(f);return}
  if(e.target.id==='ghAuto'){const x=sel();if(x&&x.gh){const on=e.target.checked;mutate(x.id,ns=>{ns.gh.auto=on});toast(on?'כל פרסום גרסה יעלה גם לאתר':'פרסום אוטומטי כבוי')}return}
  if(e.target.id==='zoomSel'){S.zoom=+e.target.value||1;ls.set('mk-zoom',String(S.zoom));applyZoom();return}
  if(e.target.id==='lockSel'){ls.set('mk-lock',e.target.value);toast(e.target.value==='0'?'הנעילה האוטומטית כבויה':'הנעילה האוטומטית עודכנה');return}
  if(e.target.id==='importFile'){const f=e.target.files[0];e.target.value='';if(f)importBackup(f);return}
  if(e.target.id!=='replaceFile')return;const s=sel();const f=e.target.files[0];if(!s||!f)return;
  try{const text=await f.text();let st={};try{if(s.assetId)st=diffStats(await getFile(s.assetId),text)}catch(x){}const id=await putFile(text);delete S.drafts[s.id];await mutate(s.id,ns=>{ns.assetId=id;ns.size=bytes(text);ns.lines=text.split('\n').length;ns.versions=[Object.assign({assetId:id,at:Date.now(),note:'עודכן מקובץ '+f.name},st),...(ns.versions||[])].slice(0,60)});toast('הקובץ עודכן לגרסה חדשה')}
  catch(x){toast(x.message||'ההעלאה נכשלה.')}
});
async function download(s,id){
  if(!S.downloads||!id)return;
  try{const t=await getFile(id);const nm=(s.name.replace(/[\\/:*?"<>|]/g,'').trim()||'system')+'.html';await S.downloads.save({filename:nm,data:t})}
  catch(e){if(e&&e.code!=='declined')toast('ההורדה לא הצליחה.')}
}

document.addEventListener('paste',e=>{if(!e.target||e.target.id!=='chatText')return;const files=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(f=>/^image\//.test(f.type));if(files.length){e.preventDefault();addImages(files)}});
window.addEventListener('resize',()=>{if(CM)CM.refresh()});
/* boot */
async function boot(){
  try{const n=JSON.parse(ls.get('hub-nav')||'null');if(n&&n.view){S.view=n.view;if(n.id)S.selId=n.id}}catch(e){}
  S.sample=claudeSample;S.downloads=localDownloads;S.toolsOK=true;
  gateShell('<div class="hbusy" style="justify-content:center"><span class="spin" aria-hidden="true"></span>טוען את מכלול…</div>');
  try{await IDB.open()}catch(e){S.mem=true}
  render();initSplitter();
  if(!(window.crypto&&crypto.subtle)){await afterUnlock();return}
  const a=getAuth();if(a)showLock(a);else showSetup();
}
boot().catch(e=>bootError(e&&e.message||e));
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
